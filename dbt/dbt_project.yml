name: wb_pipeline
version: '0.1.0'
config-version: 2
profile: wb_pipeline
model-paths: [models]
test-paths: [tests]
macro-paths: [macros]
clean-targets: [target, dbt_packages]
models:
  wb_pipeline:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
    reporting:
      +schema: reporting
      +materialized: view
vars:
  year_start: 2018
  year_end: 2024
  consistency_tolerance: 0.01
  indicators:
    - {code: SP.POP.TOTL, label: 'Population, total', category: population}
    - {code: NY.GDP.MKTP.CD, label: 'GDP, current US$', category: economy}
    - {code: NY.GDP.PCAP.CD, label: 'GDP per capita, current US$', category: economy}
    - {code: SP.DYN.LE00.IN, label: 'Life expectancy at birth, total years', category: health}