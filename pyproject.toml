[project]
name = "wb-pipeline"
version = "0.1.0"
description = "Traceable yearly World Bank indicators in DuckDB"
requires-python = ">=3.11"
dependencies = [
  "duckdb==1.5.6",
  "dbt-core==1.12.6",
  "dbt-duckdb==1.11.1",
  "requests==2.32.*",
  "pyyaml==6.*",
  "pytest==8.*",
  "responses==0.25.*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
